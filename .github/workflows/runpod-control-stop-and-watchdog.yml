name: RunPod CONTROL - emergency stop and independent 30min watchdog

# Uses the owner-gated CONTROL environment. BOTH lanes exclusively issue
# exact-Pod STOP, NEVER start/resume/terminate, and never touch private PRs.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  emergency-stop:
    name: Authenticated emergency STOP of exact RunPod Pod
    if: ${{ github.repository == 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher' && github.ref == 'refs/heads/main' && github.actor == 'devfactory-reviewer-service' && github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.number == 52 && !github.event.issue.pull_request && github.event.comment.body == 'DEVFACTORY_RUNPOD_STOP_EXACT_R162' }}
    environment: runpod-gpu-control
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load exact protected main stop code and tests
        shell: bash
        env:
          PUBLISHER_REPO: ${{ github.repository }}
          PUBLISHER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$PUBLISHER_REPO" = 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher'
          [[ "$PUBLISHER_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p source
          curl --fail --silent --show-error --location --retry 2 \
            --proto '=https' --proto-redir '=https' --max-time 45 --max-filesize 8388608 \
            "https://api.github.com/repos/${PUBLISHER_REPO}/tarball/${PUBLISHER_SHA}" \
            --output "$RUNNER_TEMP/stop-exact-publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/stop-exact-publisher.tar.gz" -C source --strip-components=1
          node --test source/test/runpod-control-stop-exact-pod.test.mjs
      - name: Stop exact Pod and verify provider EXITED
        shell: bash
        env:
          RUNPOD_CONTROL_API_KEY: ${{ secrets.RUNPOD_CONTROL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RUNPOD_CONTROL_API_KEY:-}"
          node source/scripts/runpod-control-stop-exact-pod.mjs --stop-exact

  independent-watchdog:
    name: Independent provider STOP after bounded 30 minutes
    if: ${{ github.repository == 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher' && github.ref == 'refs/heads/main' && github.actor == 'devfactory-reviewer-service' && github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.number == 52 && !github.event.issue.pull_request && github.event.comment.body == 'DEVFACTORY_RUNPOD_WATCHDOG_ARM_R163' }}
    concurrency:
      group: reviewer-b-runpod-one-independent-watchdog
      cancel-in-progress: false
    environment: runpod-gpu-control
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Load exact protected main stop code and tests before timer starts
        shell: bash
        env:
          PUBLISHER_REPO: ${{ github.repository }}
          PUBLISHER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$PUBLISHER_REPO" = 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher'
          [[ "$PUBLISHER_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p source
          curl --fail --silent --show-error --location --retry 2 \
            --proto '=https' --proto-redir '=https' --max-time 45 --max-filesize 8388608 \
            "https://api.github.com/repos/${PUBLISHER_REPO}/tarball/${PUBLISHER_SHA}" \
            --output "$RUNNER_TEMP/watchdog-publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/watchdog-publisher.tar.gz" -C source --strip-components=1
          node --test source/test/runpod-control-stop-exact-pod.test.mjs
      - name: Independent 30 minute deadline from protected runner
        shell: bash
        run: |
          set -euo pipefail
          sleep 1800
      - name: Stop exact Pod and verify provider EXITED at deadline
        shell: bash
        env:
          RUNPOD_CONTROL_API_KEY: ${{ secrets.RUNPOD_CONTROL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RUNPOD_CONTROL_API_KEY:-}"
          node source/scripts/runpod-control-stop-exact-pod.mjs --stop-exact
